  <!-- Autor -->
  <text x="36" y="58" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, sans-serif" font-size="12" font-weight="bold" fill="#8b5cf6" letter-spacing="1">
    — ADA LOVELACE
  </text>
  
  <!-- Detalle de píxeles retro en la esquina inferior derecha -->
  <rect x="860" y="44" width="6" height="6" fill="#45475a" />
  <rect x="868" y="44" width="6" height="6" fill="#6366f1" />
  <rect x="868" y="52" width="6" height="6" fill="#8b5cf6" />
